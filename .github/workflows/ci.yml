name: CI

# §19 pide «CI/CD con pruebas de integración contra Postgres real». Nada de
# sqlite ni de mocks del motor: la mitad de las garantías de este sistema —RLS,
# restricciones de exclusión, unicidad bajo concurrencia— sólo existen dentro
# de Postgres. Probarlas contra otra cosa es probar otra cosa.

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fleetfuel_test
          POSTGRES_USER: fleetfuel_owner
          POSTGRES_PASSWORD: ci_password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetfuel_owner -d fleetfuel_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      DATABASE_NAME: fleetfuel_test
      DATABASE_USER: fleetfuel_owner
      DATABASE_PASSWORD: ci_password
      DATABASE_APP_USER: fleetfuel_app
      DATABASE_APP_PASSWORD: ci_password_app
      JWT_SECRET: ci_secret_de_pruebas_no_usar_en_produccion
      REFRESH_TOKEN_SECRET: ci_refresh_de_pruebas_no_usar_en_produccion
      REDIS_HOST: localhost
      REDIS_PORT: 6380

    defaults:
      run: { working-directory: backend }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Compilación de tipos
        run: npm run typecheck
      # El backend no tuvo ESLint hasta el 2026-09-07: el frontend sí y él no,
      # y nadie lo echaba de menos porque CI no lo pedía. Va con reglas CON
      # TIPOS —`no-floating-promises` es la que importa aquí: una promesa
      # perdida es un INSERT que no ocurrió dentro de la transacción—.
      - name: Estilo
        run: npm run lint
      # Las migraciones van ANTES de las pruebas: la mitad de la suite corre
      # contra el motor de verdad y necesita las tablas puestas.
      - name: Migraciones contra Postgres real
        run: npm run migration:run
      - name: Seed
        run: npm run seed
      # Unitarias e integración en UNA sola pasada, con umbral de cobertura.
      # Separadas medían mentiras: las unitarias daban 9 % porque les faltaba
      # media suite, y las de integración 100 % porque sin `collectCoverageFrom`
      # sólo instrumentaban los siete enunciados que llegaban a importar.
      # El umbral es un trinquete puesto justo por debajo de lo que había.
      # Ver backend/test/COBERTURA.md antes de tocarlo.
      - name: Pruebas y cobertura
        run: npm run test:cobertura
      - name: La migración se puede revertir
        run: npm run migration:revert

  # Trabajo aparte del backend: no comparte servicios ni variables, y así un
  # fallo de estilo no queda enterrado bajo el arranque de Postgres.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Compilación de tipos
        run: npm run typecheck
      # `npm run lint` NO entra aquí todavía, y es deuda declarada: el frontend
      # arrastra 12 errores propios —8 `react-hooks/set-state-in-effect` en
      # cinco componentes, más `no-unused-vars` y `no-explicit-any` en ficheros
      # de prueba— anteriores a que hubiera puerta ninguna. Añadirlo hoy dejaría
      # `main` en rojo por algo que ningún commit nuevo rompe, y de ahí sale
      # siempre la misma salida: quitar el paso. Cuando esos 12 estén en cero,
      # este paso y la línea `frontend` de `githooks/pre-commit` entran juntos.
      #
      # El backend sí lo tiene, y es lo que impide que la deuda crezca por el
      # lado que hoy está limpio.
      # Criterio de salida de UX-0. Falla el build si un token deja de cumplir
      # AA: es lo que impide que la accesibilidad se erosione token a token
      # cuando nadie recuerde por qué --fg-muted tenía ese valor exacto.
      - name: Auditoría de contraste AA
        run: npm run auditar:contraste
      # El frontend no tenía NINGUNA prueba hasta el 2026-09-06. El umbral es un
      # suelo bajísimo a propósito: impide que estas tres suites se borren o se
      # dejen pudrir, no pretende ser una meta. Ver frontend/PRUEBAS.md.
      - name: Pruebas y cobertura
        run: npm run test:cov
      - name: Build
        run: npm run build

  # ── Observabilidad: el canal de alertas ───────────────────────────────────
  #
  # Existe porque `ops/` era el único código del repositorio fuera de todo
  # informe de cobertura: 690 líneas cuyo 0 % no aparecía en ningún porcentaje
  # y por tanto no se echaba de menos. El traductor de avisos se desplegó el
  # 2026-09-06 sin una sola prueba y con un fallo dentro —el título viajaba en
  # una cabecera HTTP, que no es UTF-8, y las seis alertas con tilde llegaban
  # rotas mientras ntfy respondía 200—. Se encontró a mano, mirando el móvil.
  #
  # No necesita `npm ci`: el traductor no tiene dependencias y estas pruebas
  # usan el runner que trae Node. Por eso el trabajo tarda segundos, y por eso
  # no hay excusa para no tenerlo.
  observabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # El umbral está por debajo de lo medido (98/92/86) a propósito: es un
      # suelo que impide borrar las pruebas, no una meta que perseguir.
      - name: Pruebas del traductor de avisos y contrato de las reglas
        run: >
          node --test --experimental-test-coverage
          --test-coverage-exclude='**/*.test.mjs'
          --test-coverage-lines=90 --test-coverage-branches=85 --test-coverage-functions=80
          ops/observabilidad/aviso/servidor.test.mjs ops/observabilidad/reglas.test.mjs

  # ── Recorridos de extremo a extremo ──────────────────────────────────────
  #
  # Estuvieron fuera de CI hasta el 2026-09-06, y no por el entorno: en Actions
  # basta `playwright install --with-deps`. Lo que faltaba era levantar la
  # aplicación ENTERA dentro del trabajo, que es lo que hace este.
  #
  # Es el único sitio donde se comprueba lo que el §26 pide literalmente —«un
  # operador da de alta … DESDE LA UI»— y también el único que recorre la cadena
  # completa: navegador → Next → API → Postgres. Ni las pruebas de componente ni
  # las de la API lo cubren; cada una prueba su lado del cable.
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fleetfuel_e2e
          POSTGRES_USER: fleetfuel_owner
          POSTGRES_PASSWORD: ci_password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetfuel_owner -d fleetfuel_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      DATABASE_NAME: fleetfuel_e2e
      DATABASE_USER: fleetfuel_owner
      DATABASE_PASSWORD: ci_password
      DATABASE_APP_USER: fleetfuel_app
      DATABASE_APP_PASSWORD: ci_password_app
      JWT_SECRET: ci_secret_de_pruebas_no_usar_en_produccion
      REFRESH_TOKEN_SECRET: ci_refresh_de_pruebas_no_usar_en_produccion
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      BACKEND_PORT: 4100
      SEED_ADMIN_CORREO: admin@fleetfuel.jop.lat
      SEED_ADMIN_CLAVE: ClaveDeCI12345
      # El freno del login se afloja SOLO en este trabajo. Los dos recorridos
      # inician sesión varias veces cada uno —la sonda de inscripción y la
      # entrada por la interfaz— y con el límite de producción (5 por minuto y
      # cuenta) un reintento del trabajo se topa con un 429 que no tiene nada
      # que ver con lo que se está probando. Aflojarlo aquí no lo debilita en
      # ningún sitio real: su comportamiento se prueba en `api.integracion.ts`,
      # que sí comprueba que corta a la sexta.
      LOGIN_LIMITE_CUENTA: 60
      LOGIN_LIMITE_IP: 300
      # El administrador nace SIN segundo factor: el recorrido lo inscribe por
      # la API antes de entrar, igual que haría el primer usuario real. Por eso
      # no hace falta un secreto conocido aquí.
      E2E_TOTP_SECRETO: ''

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Preparar la base de datos
        run: |
          npm ci
          npm run build
          npm run migration:run:dist
          npm run seed:dist
        working-directory: backend

      - name: Arrancar la API
        run: |
          node dist/main.js &
          # Se espera a que RESPONDA, no un tiempo fijo: en un runner cargado
          # cualquier `sleep` es o demasiado corto o desperdicio.
          for i in $(seq 1 60); do
            curl -sf http://localhost:4100/api/salud > /dev/null && exit 0
            sleep 1
          done
          echo "La API no respondió en 60 s"; exit 1
        working-directory: backend

      - name: Construir y arrancar la interfaz
        run: |
          npm ci
          npm run build
          PORT=3100 npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/entrar > /dev/null && exit 0
            sleep 1
          done
          echo "La interfaz no respondió en 60 s"; exit 1
        working-directory: frontend
        env:
          # Se hornea en el bundle al construir: aquí no hay proxy inverso
          # delante, así que la URL tiene que ser absoluta.
          NEXT_PUBLIC_API_URL: http://localhost:4100/api

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: 1A · alta de catálogos desde la UI
        run: node e2e/recorrido.mjs
        working-directory: frontend

      - name: 1B · orden → plan de carga → viaje autorizado
        run: node e2e/recorrido-1b.mjs
        working-directory: frontend

      - name: Capturas del recorrido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorridos
          path: frontend/e2e/ultimo-recorrido*.png
          if-no-files-found: ignore
