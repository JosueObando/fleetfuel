# Aprovisionadas por fichero y no a mano en la interfaz: una fuente de datos
# creada a mano vive sólo en el volumen de Grafana, y se pierde el día que se
# recrea el contenedor. Esto se versiona.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
