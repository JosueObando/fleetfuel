# Proxy inverso de FleetFuel Control — un solo origen.
#
# El frontend en "/" y la API en "/api" bajo el MISMO nombre de host. Esa es la
# decisión del 2026-09-06 y no es cosmética: `NEXT_PUBLIC_API_URL=/api` viaja
# horneada en el bundle del navegador, así que si el frontend y la API no
# comparten origen, el navegador pide "/api/..." al servidor del frontend y
# recibe un 404 de Next.js. Los dos bloques `location` de aquí abajo son lo
# que hace que esa URL relativa signifique algo.
#
# En producción quien manda es el Nginx Proxy Manager de 10.0.0.19; este
# fichero es (a) la referencia exacta de lo que hay que configurar allí y
# (b) ejecutable tal cual, para probar el enrutado sin tocar NPM:
#
#   sg docker -c "docker run --rm --name fleetfuel_proxy_prueba \
#     --network host \
#     -v /home/app/fleetfuel/ops/nginx-fleetfuel.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:alpine"
#
#   curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8081/entrar
#   curl -s http://localhost:8081/api/salud

# Para cuando el chat y el seguimiento en vivo lleguen en la Fase 2: sin esto,
# nginx corta el Upgrade y la conexión WebSocket se cae en silencio. Hoy no hay
# ninguna, pero el mapa no cuesta nada y el fallo que evita es de los caros de
# diagnosticar.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

# --- Freno de fuerza bruta contra el login -------------------------------
# `POST /api/auth/login` es @Publico() y no tiene ningun limite en el backend:
# no hay @nestjs/throttler ni bloqueo por intentos fallidos. Y lleva LOS DOS
# FACTORES en el mismo cuerpo —la clave y el codigo TOTP de 6 digitos—, con un
# `authenticator.check` de otplib que no marca los codigos ya usados. Este
# limite es, literalmente, la unica defensa que hay.
#
# La forma elegida es RAFAGA GENEROSA + RITMO CORTO, y no al reves, porque los
# dos casos que hay que separar tienen formas distintas:
#
#   - El pico legitimo es una RAFAGA. Veinte personas entrando a las 8:00, y
#     alguna tecleando mal el TOTP porque rota cada 30 segundos. Ademas, si la
#     Alcaldia sale por NAT, $binary_remote_addr los cuenta como UNA sola
#     direccion: un limite pensado para un atacante los bloquearia a ellos.
#   - El ataque es SOSTENIDO. Lo que le sirve no es un pico, es mantener el
#     ritmo durante horas.
#
# Con rate=10r/m y burst=30 nodelay:
#   - las 30 primeras peticiones pasan al instante (el pico de la manana),
#   - despues queda 1 cada 6 segundos: 600 intentos por hora contra la clave,
#   - y contra el TOTP, unos 5 intentos por cada ventana de 30 segundos, sobre
#     un millon de codigos posibles. Inviable sin tocar el diseno.
#
# El cubo tarda 3 minutos en rellenarse entero, asi que un atacante no puede
# encadenar rafagas.
#
# 429 y no el 503 por defecto: dice honestamente "demasiadas peticiones" y el
# frontend puede mostrar "espera un momento" en vez de un error generico que
# acabe en una llamada a soporte.
#
# Si resulta que 30 se queda corto en el pico real, se sube el burst —no el
# rate—: es el numero que atiende a las personas sin ayudar al atacante.
#
# La zona va en contexto http. 10 MB guardan el estado de ~160.000 direcciones.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# `/api/auth/refrescar` queda FUERA a proposito: tambien es @Publico(), pero
# cada sesion lo llama cada 15 minutos cuando caduca el token de acceso. Un
# limite estrecho ahi no para a nadie —el token de refresco no se adivina— y
# en cambio expulsaria a los usuarios en mitad de la jornada.

upstream fleetfuel_frontend { server 10.0.0.193:3200; }
upstream fleetfuel_backend  { server 10.0.0.193:4200; }

server {
    listen 8081;
    server_name _;

    # La versión exacta de nginx es información gratis para quien busque un CVE
    # conocido, igual que el poweredByHeader que ya se desactivó en Next.
    server_tokens off;

    # Fase 2 sube fotografías del conductor. El defecto de nginx es 1 MB: una
    # foto de móvil lo pasa de sobra y el usuario vería un 413 sin explicación.
    client_max_body_size 25m;

    # --- La API -----------------------------------------------------------
    # Va PRIMERO porque en nginx un prefijo más largo gana sobre "/", pero
    # dejarlo explícito evita sorpresas al añadir bloques después.
    #
    # `proxy_pass` SIN barra final ni ruta: así nginx pasa el URI completo tal
    # cual. Con "http://fleetfuel_backend/" nginx REEMPLAZARÍA el prefijo y el
    # backend —que usa setGlobalPrefix('api')— recibiría "/salud" en vez de
    # "/api/salud" y devolvería 404 en todo.
    location /api {
        proxy_pass http://fleetfuel_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Sin estas dos, @Ip() del backend devuelve la IP del proxy y CADA
        # inicio de sesión quedaría auditado como venido de aquí: la traza de
        # quién entró desde dónde se destruye en silencio, sin un solo error.
        # El backend ya las espera (PROXIES_DE_CONFIANZA=10.0.0.19).
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;

        # El login con MFA valida un TOTP y las consultas grandes de catálogos
        # pueden tardar; 60s es holgado sin llegar a colgar al usuario.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # La API no se cachea nunca: son datos por empresa, y una respuesta
        # cacheada servida a otra operadora sería una fuga entre empresas que
        # el RLS de Postgres no puede impedir porque la consulta no llega.
        proxy_buffering off;
    }

    # --- Solo el login ----------------------------------------------------
    # Hereda todo del bloque /api de arriba, pero con el freno puesto. Se
    # separa porque limitar TODA la API al ritmo del login estrangularia el
    # uso normal: una pantalla de catalogos hace varias peticiones seguidas y
    # es trafico legitimo.
    location = /api/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://fleetfuel_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    # --- El frontend ------------------------------------------------------
    location / {
        proxy_pass http://fleetfuel_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js usa WebSocket para el refresco en caliente; en `next start`
        # no, pero el bloque no estorba y evita un fallo raro si alguien
        # levanta el modo desarrollo detrás del proxy por error.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
