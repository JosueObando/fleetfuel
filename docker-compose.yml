services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fleetfuel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fleetfuel_db}
      POSTGRES_USER: ${DATABASE_USER:-fleetfuel_owner}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cambiar_en_produccion}
    ports:
      # 5433 y no 5432: otro Postgres ocupa ya el puerto por defecto en esta
      # sistemas se desarrollan en la misma máquina.
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-fleetfuel_owner} -d ${DATABASE_NAME:-fleetfuel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleetfuel_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Etapa con devDependencies y src/: `migration:run` y `seed` son scripts
      # de ts-node sobre las fuentes, que la etapa `production` no incluye.
      target: development
    container_name: fleetfuel_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-4100}:4100"
    # El árbol de trabajo, montado encima de la imagen.
    #
    # Sin esto el contenedor corre lo que se construyó la última vez: `start:dev
    # --watch` vigila ficheros que no cambian nunca, y
    # `docker compose exec backend npm run test:cobertura` —el comando que
    # documenta el README— mide una copia congelada. Se descubrió el 2026-09-06
    # auditando la suite: la copia de `test/` dentro del contenedor tenía 395
    # líneas y la del disco 615, y una prueba de mutación que parecía demostrar
    # algo no había llegado a tocar el código mutado.
    #
    # Se montan `src/` y `test/` y NO `/app` entero a propósito: montar la raíz
    # taparía `node_modules`, que se instala DENTRO de la imagen con `npm ci`.
    # Como contrapartida, `package.json`, `tsconfig.json` y `nest-cli.json`
    # siguen viniendo de la imagen: tocarlos sigue exigiendo `--build`, que es
    # lo correcto —cambiar dependencias no es un cambio en caliente—.
    volumes:
      - ./backend/src:/app/src
      - ./backend/test:/app/test
    depends_on:
      db:
        condition: service_healthy
    # Las migraciones corren como DUEÑO (DATABASE_USER); el proceso que queda
    # sirviendo se conecta con el rol restringido. Es la misma imagen: lo que
    # cambia es qué credencial usa cada comando.
    command: sh -c "npm run migration:run && npm run start:dev"

volumes:
  db_data:
  redis_data:
